frr version 8.4_git
frr defaults traditional
hostname Spine1
log syslog informational
domainname 
!
ip route 0.0.0.0/0 192.168.1.2
!
interface bond1
 description To-Leaf1
 evpn mh es-id 1
 evpn mh es-sys-mac 00:00:00:00:00:01
exit
!
interface bond2
 description To-Leaf2
 evpn mh es-id 2
 evpn mh es-sys-mac 00:00:00:00:00:01
exit
!
interface bond3
 description To-Leaf3
 evpn mh es-id 3
 evpn mh es-sys-mac 00:00:00:00:00:01
exit
!
interface eth1
 ip address 192.168.1.1/30
exit
!
interface eth2
 description ISL_to_Spine2
 ip address 10.0.0.4/31
exit
!
interface lo
 ip address 10.0.0.1/32
exit
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.2 update-source lo
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  neighbor 10.0.0.2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.0.2 activate
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
exit
!
router bgp 65001 vrf vrf1
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
router ospf
 network 10.0.0.1/32 area 0
 network 10.0.0.4/31 area 0
 neighbor 10.0.0.2
exit
!
